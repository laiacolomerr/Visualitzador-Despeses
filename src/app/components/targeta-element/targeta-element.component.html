<span class="title">{{ payment.name }}</span>

<div class="payment-info">
  <div class="row">
    <div class="name">Data</div>
    <span>{{ payment.date | date: 'dd-MM-yyyy' }}</span>
  </div>
  
  <div class="row">
    <div class="name">Quantitat</div>
    <span>{{ payment.amount | currency:'EUR':'symbol':'1.2-2' : 'ca-ES' }}</span>
  </div>

  <div class="row">
    <div class="name">Mètode pagament</div>
    <span>{{ getPaymentMethodLabel(payment.paymentMethod) }}</span>
  </div>

  <div *ngIf="payment.notes" class="col">
    <div class="name">Notes</div>
    <span>{{ payment.notes }}</span>
  </div>
</div>
